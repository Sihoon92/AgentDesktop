<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>에이전트 스텝 뷰어</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chat.js" defer></script>
  <script src="/static/knowledge.js" defer></script>
  <script src="/static/workflows.js" defer></script>
  <script src="/static/profiles.js" defer></script>
  <script src="/static/stages.js" defer></script>
  <script src="/static/progress.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>에이전트 스텝 뷰어</h1>
    <div id="view-switch" class="segmented view-switch" role="group" aria-label="보기" hidden>
      <button type="button" id="show-runs" aria-pressed="true">실행</button>
      <button type="button" id="show-knowledge" aria-pressed="false">지식</button>
      <button type="button" id="show-workflows" aria-pressed="false" hidden>workflow</button>
      <button type="button" id="show-profiles" aria-pressed="false" hidden>등록</button>
    </div>
    <p class="hint" id="key-hint">← → 스텝 이동 · B 동작 전/후 · A 전체 요소/대상만 · T 텍스트 박스 · V 다음 비전 스텝</p>
    <div class="viewer-controls">
      <span id="control-status" class="control-status" role="status" aria-live="polite"></span>
      <button type="button" id="stop-run" class="ghost stop-run" hidden disabled title="진행 중인 실행을 다음 안전한 자리에서 멈춥니다. 대상 앱은 닫지 않습니다">실행 멈춤</button>
      <button type="button" id="shutdown-viewer" class="ghost shutdown-viewer" hidden title="뷰어 서버를 끕니다">뷰어 종료</button>
    </div>
  </header>

  <div id="confirm-strip" class="confirm-strip" role="group" aria-labelledby="confirm-text" hidden>
    <span id="confirm-text" class="confirm-text"></span>
    <button type="button" id="confirm-yes" class="danger"></button>
    <button type="button" id="confirm-no" class="ghost">취소</button>
  </div>

  <div id="closed-cover" class="closed-cover" hidden>
    <p id="closed-text" class="closed-text" role="status" aria-live="polite" tabindex="-1"></p>
  </div>

  <div id="export-warning" class="export-warning" role="note" hidden></div>

  <form id="start-form" class="start-form" hidden autocomplete="off" novalidate>
    <div class="start-row">
      <label class="field goal-field">
        <span class="visually-hidden">지시</span>
        <input id="goal" name="goal" type="text" placeholder="지시 · 예: 설정 패널을 열어줘" maxlength="2000" aria-label="지시">
      </label>
      <button type="button" id="toggle-settings" class="ghost settings-toggle" aria-expanded="false" aria-controls="start-settings">설정</button>
      <span id="settings-summary" class="settings-summary"></span>
      <span id="start-status" class="start-status" role="status" aria-live="polite"></span>
      <button type="submit" id="start-run" class="primary">실행</button>
    </div>
    <div id="start-settings" class="start-settings" hidden>
      <label id="system-choice-field" class="field system-choice-field" hidden>
        <span>시스템</span>
        <select id="system-choice" name="system_choice" title="설정 파일의 systems에 적은 시스템. 고르면 그 실행 파일을 띄웁니다"></select>
      </label>
      <label id="exe-field" class="field exe-field">
        <span>실행 파일</span>
        <input id="exe" name="exe" type="text" spellcheck="false">
      </label>
      <label id="system-field" class="field system-field">
        <span>시스템</span>
        <input id="system" name="system" type="text" maxlength="64" spellcheck="false" placeholder="비우면 실행 파일 이름" title="지식을 나눠 두는 이름. 영문, 숫자, 한글, '.', '_', '-'">
      </label>
      <label class="field">
        <span>권한</span>
        <select id="level" name="level"></select>
      </label>
      <label class="field stage-limit-field">
        <span>단계별 호출 한도</span>
        <input id="stage-call-limit" name="stage_call_limit" type="text" inputmode="numeric" maxlength="4" spellcheck="false" placeholder="비우면 기본값" title="계획의 단계 하나가 쓸 수 있는 모델 호출 수. 다 쓰면 사람에게 묻습니다">
      </label>
      <label class="check-field">
        <input id="approve" name="approve" type="checkbox">
        <span>동작 전 승인</span>
      </label>
    </div>
  </form>

  <div id="layout" class="layout">
    <nav id="runs-panel" class="runs panel" aria-label="실행 목록">
      <div class="panel-title">
        <button type="button" id="toggle-runs" class="panel-toggle" aria-expanded="true" aria-controls="runs-body" data-panel="runs"><span class="panel-arrow" aria-hidden="true"></span><span class="visually-hidden">실행 목록 접기·펴기</span></button>
        <h2>실행</h2>
        <button type="button" id="refresh-runs" class="ghost panel-extra" title="목록 새로고침">새로고침</button>
      </div>
      <div id="runs-body" class="panel-body runs-body">
        <div class="run-filters" role="search">
          <input id="run-search" type="search" placeholder="지시·실행 파일 검색" maxlength="200" aria-label="지시나 실행 파일 이름으로 검색" autocomplete="off">
          <div class="run-filter-row">
            <select id="run-status" aria-label="상태"></select>
            <input id="run-since" type="date" aria-label="이 날짜 이후" title="이 날짜 이후">
          </div>
        </div>
        <ul id="run-list" class="run-list"></ul>
        <p id="run-empty" class="empty" hidden>기록된 실행이 없습니다.</p>
        <button type="button" id="run-more" class="ghost run-more" hidden>더 불러오기</button>
      </div>
    </nav>

    <section id="chat" class="chat panel" aria-label="질문과 답" hidden>
      <div class="panel-title">
        <button type="button" id="toggle-chat" class="panel-toggle" aria-expanded="true" aria-controls="chat-body" data-panel="chat"><span class="panel-arrow" aria-hidden="true"></span><span class="visually-hidden">대화 접기·펴기</span></button>
        <h2 class="chat-title">대화</h2>
        <span id="chat-pending" class="pending-badge" hidden>질문 대기</span>
      </div>
      <div id="chat-body" class="panel-body chat-body">
        <ol id="chat-log" class="chat-log"></ol>
        <div id="chat-composer" class="chat-composer"></div>
      </div>
    </section>

    <main class="stage-area">
      <div id="banner" class="banner" role="status" hidden></div>
      <div id="ready-banner" class="ready-banner" role="status" aria-live="polite" hidden></div>
      <div class="stage-toolbar">
        <div class="segmented" role="group" aria-label="프레임">
          <button type="button" id="show-before" aria-pressed="true">동작 전</button>
          <button type="button" id="show-after" aria-pressed="false">동작 후</button>
        </div>
        <div class="segmented" role="group" aria-label="표시할 박스">
          <button type="button" id="show-all" aria-pressed="true">전체 요소</button>
          <button type="button" id="show-target" aria-pressed="false">대상만</button>
        </div>
        <button type="button" id="show-texts" class="toggle" aria-pressed="true" title="텍스트 요소 박스 켜기·끄기 (T)">텍스트 박스</button>
        <span id="frame-label" class="frame-label"></span>
        <span id="truncated-note" class="truncated-note" hidden></span>
      </div>
      <section id="stage-bar" class="stage-bar" aria-label="단계" hidden>
        <ol id="stage-list" class="stage-list"></ol>
        <div class="stage-detail-row">
          <p id="stage-detail" class="stage-detail" aria-live="polite"></p>
          <button type="button" id="stage-detail-toggle" class="ghost stage-detail-toggle" aria-expanded="false" aria-controls="stage-detail" hidden>전체 보기</button>
        </div>
      </section>
      <div class="stage-scroll">
        <div id="stage" class="stage" hidden>
          <img id="frame" alt="">
          <svg id="overlay" class="overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" class="arrow-head"></path>
              </marker>
              <marker id="arrow-proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" class="arrow-head proposal"></path>
              </marker>
            </defs>
          </svg>
          <div id="labels" class="labels"></div>
        </div>
        <p id="stage-empty" class="empty stage-empty">왼쪽에서 실행을 고르세요.</p>
      </div>
      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </main>

    <aside id="details-panel" class="details panel" aria-label="스텝 정보">
      <div class="panel-title">
        <button type="button" id="toggle-details" class="panel-toggle" aria-expanded="true" aria-controls="details-body" data-panel="details"><span class="panel-arrow" aria-hidden="true"></span><span class="visually-hidden">스텝 정보 접기·펴기</span></button>
        <h2>스텝 정보</h2>
      </div>
      <div id="details-body" class="panel-body details-scroll">
        <section id="summary-box" class="summary-box" aria-label="실행 요약" hidden>
          <div class="summary-head">
            <button type="button" id="toggle-summary" class="ghost" aria-expanded="false" aria-controls="summary-text">실행 요약 보기</button>
            <button type="button" id="copy-summary" class="ghost">요약 복사</button>
            <span id="copy-status" class="copy-status" role="status"></span>
            <span class="summary-note">화면의 글 없이 수와 코드만 담았습니다. 그대로 전해도 됩니다.</span>
          </div>
          <pre id="summary-text" class="summary-text" hidden></pre>
        </section>
        <div id="step-info"></div>
        <details id="observation-box" class="observation" hidden>
          <summary>모델이 받은 관찰 텍스트</summary>
          <pre id="observation-text"></pre>
        </details>
      </div>
    </aside>
  </div>

  <section id="knowledge-view" class="knowledge-view" aria-label="시스템별 지식" hidden></section>

  <section id="workflow-view" class="knowledge-view workflow-view" aria-label="시스템별 workflow" hidden></section>

  <section id="profile-view" class="knowledge-view profile-view" aria-label="시스템 프로파일 등록" hidden></section>

  <footer class="timeline-bar">
    <div id="run-summary" class="run-summary" role="status" hidden></div>
    <section id="now-panel" class="now-panel" aria-label="지금 하는 일" hidden></section>
    <ol id="timeline" class="timeline" aria-label="스텝 타임라인"></ol>
  </footer>
</body>
</html>
