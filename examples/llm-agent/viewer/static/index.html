<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>에이전트 단계 뷰어</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chat.js" defer></script>
  <script src="/static/knowledge.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>에이전트 단계 뷰어</h1>
    <div id="view-switch" class="segmented view-switch" role="group" aria-label="보기" hidden>
      <button type="button" id="show-runs" aria-pressed="true">실행</button>
      <button type="button" id="show-knowledge" aria-pressed="false">지식</button>
    </div>
    <p class="hint" id="key-hint">← → 단계 이동 · B 동작 전/후 · A 전체 요소/대상만 · T 텍스트 박스</p>
  </header>

  <div id="export-warning" class="export-warning" role="note" hidden></div>

  <form id="start-form" class="start-form" hidden autocomplete="off">
    <label class="field goal-field">
      <span>지시</span>
      <input id="goal" name="goal" type="text" placeholder="예: 설정 패널을 열어줘" maxlength="2000">
    </label>
    <label class="field exe-field">
      <span>실행 파일</span>
      <input id="exe" name="exe" type="text" spellcheck="false">
    </label>
    <label class="field system-field">
      <span>시스템</span>
      <input id="system" name="system" type="text" maxlength="64" spellcheck="false" placeholder="비우면 실행 파일 이름" title="지식을 나눠 두는 이름. 영문, 숫자, 한글, '.', '_', '-'">
    </label>
    <label class="field">
      <span>권한</span>
      <select id="level" name="level"></select>
    </label>
    <label class="check-field">
      <input id="approve" name="approve" type="checkbox">
      <span>동작 전 승인</span>
    </label>
    <button type="submit" id="start-run" class="primary">실행</button>
    <span id="start-status" class="start-status" role="status" aria-live="polite"></span>
  </form>

  <div class="layout">
    <nav class="runs" aria-label="실행 목록">
      <div class="panel-title">
        <h2>실행</h2>
        <button type="button" id="refresh-runs" class="ghost" title="목록 새로고침">새로고침</button>
      </div>
      <div class="run-filters" role="search">
        <input id="run-search" type="search" placeholder="지시·실행 파일 검색" maxlength="200" aria-label="지시나 실행 파일 이름으로 검색" autocomplete="off">
        <div class="run-filter-row">
          <select id="run-status" aria-label="상태"></select>
          <input id="run-since" type="date" aria-label="이 날짜 이후" title="이 날짜 이후">
        </div>
      </div>
      <ul id="run-list" class="run-list"></ul>
      <p id="run-empty" class="empty" hidden>기록된 실행이 없습니다.</p>
      <button type="button" id="run-more" class="ghost run-more" hidden>더 불러오기</button>
    </nav>

    <main class="stage-area">
      <div id="banner" class="banner" role="status" hidden></div>
      <div class="stage-toolbar">
        <div class="segmented" role="group" aria-label="프레임">
          <button type="button" id="show-before" aria-pressed="true">동작 전</button>
          <button type="button" id="show-after" aria-pressed="false">동작 후</button>
        </div>
        <div class="segmented" role="group" aria-label="표시할 박스">
          <button type="button" id="show-all" aria-pressed="true">전체 요소</button>
          <button type="button" id="show-target" aria-pressed="false">대상만</button>
        </div>
        <button type="button" id="show-texts" class="toggle" aria-pressed="true" title="텍스트 요소 박스 켜기·끄기 (T)">텍스트 박스</button>
        <span id="frame-label" class="frame-label"></span>
        <span id="truncated-note" class="truncated-note" hidden></span>
      </div>
      <div class="stage-scroll">
        <div id="stage" class="stage" hidden>
          <img id="frame" alt="">
          <svg id="overlay" class="overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" class="arrow-head"></path>
              </marker>
              <marker id="arrow-proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" class="arrow-head proposal"></path>
              </marker>
            </defs>
          </svg>
          <div id="labels" class="labels"></div>
        </div>
        <p id="stage-empty" class="empty stage-empty">왼쪽에서 실행을 고르세요.</p>
      </div>
      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </main>

    <aside class="details" aria-label="단계 정보와 대화">
      <div class="details-scroll">
        <div id="step-info"></div>
        <details id="observation-box" class="observation" hidden>
          <summary>모델이 받은 관찰 텍스트</summary>
          <pre id="observation-text"></pre>
        </details>
      </div>
      <section id="chat" class="chat" aria-label="질문과 답" hidden>
        <h2 class="chat-title">대화</h2>
        <ol id="chat-log" class="chat-log"></ol>
        <div id="chat-composer" class="chat-composer"></div>
      </section>
    </aside>
  </div>

  <section id="knowledge-view" class="knowledge-view" aria-label="시스템별 지식" hidden></section>

  <footer class="timeline-bar">
    <div id="run-summary" class="run-summary" role="status" hidden></div>
    <ol id="timeline" class="timeline" aria-label="단계 타임라인"></ol>
  </footer>
</body>
</html>
