# 설정 파일 예시
#
# 이 파일을 settings.local.yaml로 복사하고 쓸 줄의 '#'을 지워 값을 적습니다.
# settings.local.yaml은 Git에서 제외되므로 회사마다 다른 값을 커밋하지 않고 둘 수 있습니다.
# 다른 위치의 파일을 쓰려면 환경변수 AGENT_SETTINGS에 그 경로를 적습니다.
#
# 우선순위: 명령줄 인자 > 작업 파일의 키 > 이 파일 > 코드의 기본값
# API 키와 주소(OPENAI_API_KEY, OPENAI_BASE_URL, VISION_API_KEY, VISION_BASE_URL)는 여기가 아니라 .env에 둡니다.
# 이 파일에 없는 키를 적으면 실행이 오류로 멈춥니다.

# 텍스트 모델 이름. Responses API의 model 값으로 보냅니다.
# 우선순위: 작업 파일 > 이 파일 > 환경변수 OPENAI_MODEL > 코드의 기본값
# model:

# 추론 노력. 모델이 받는 값(예: low, medium, high)을 적습니다.
# omit으로 적으면 reasoning 인자를 보내지 않습니다(그 인자를 받지 못하는 모델용).
# reasoning_effort:

# 화면 그림을 모델에 주는 방식: off, user_message, tool_output 중 하나.
# check.py의 LLM 그림 입력 항목이 권하는 값을 적습니다.
# image_mode:

# 시스템별 지식을 쌓는 폴더. 상대 경로는 이 파일이 있는 폴더를 기준으로 합니다.
# 환경변수 AGENT_KNOWLEDGE_DIR보다 이 값이 앞섭니다.
# 따옴표 없이 적습니다. 큰따옴표 안에서는 역슬래시가 특수 문자입니다(작은따옴표는 괜찮습니다).
#   예) knowledge_dir: D:\Example\knowledge
# knowledge_dir:

# 대상 앱 실행 파일의 절대 경로. run.py --goal과 view.py에서 --exe가 없을 때 씁니다.
# 따옴표 없이 적습니다. 큰따옴표 안에서는 역슬래시가 특수 문자입니다(작은따옴표는 괜찮습니다).
#   예) exe: C:\Example\App\Example.exe
# exe:

# 지식의 시스템 이름(영문, 숫자, 한글, '.', '_', '-', 64자까지). 비우면 실행 파일 이름을 씁니다.
# system:

# 단계마다 쓸 수 있는 모델 호출 수(1 이상의 정수, 기본 8). 다 쓰면 계속할지 사람에게 묻습니다.
# stage_call_limit:

# 계획을 세우기 전 호출의 추론 노력(기본 medium). 계획이 생긴 뒤에는 reasoning_effort를 씁니다.
# omit으로 적으면 reasoning 인자를 보내지 않습니다.
# plan_reasoning_effort:

# 비전 모델 이름. 있으면 텍스트 모델에게 그림을 보내지 않고, 그림이 필요할 때 비전 모델에게 묻습니다.
# 환경변수 VISION_MODEL보다 이 값이 앞섭니다. 비전 모델을 쓰면 image_mode는 무시됩니다.
# vision_model:

# 비전 모델의 추론 노력. 적을 때만 reasoning 인자를 보냅니다(기본: 보내지 않음).
# vision_reasoning_effort:

# 비전 모델에 보내는 그림의 긴 변 최대 픽셀(1 이상의 정수, 기본 1280). 더 크면 줄여 보냅니다.
# vision_max_side:

# 비전 모델이 내는 좌표의 방식: pixel(기본) 또는 normalized_1000. check.py의 비전 좌표 항목이 권하는 값을 적습니다.
# vision_points:

# 고를 수 있는 시스템들. 한 줄에 '이름: 실행 파일의 절대 경로'를 적습니다. 뷰어에서 목록으로 고르고,
# run.py --system <이름>으로도 고릅니다. 이름은 지식의 시스템 이름으로도 쓰입니다(system과 같은 규칙).
# 실행 파일 고르는 순서: --exe > --system의 항목 > 작업 파일의 exe > system이 가리키는 항목 > exe
# 경로는 따옴표 없이 적습니다. 큰따옴표 안에서는 역슬래시가 특수 문자입니다(작은따옴표는 괜찮습니다).
# 아래 이름과 경로는 예시입니다. 쓸 때는 '#'과 그 뒤 공백 하나를 지워 'systems:' 아래에 두 칸 들여 씁니다.
# systems:
#   공장A: C:\Example\MES\A\MES.exe
#   공장B: C:\Example\MES\B\MES.exe

# 준비 신호. 대상 앱을 띄운 뒤 이 글과 이름이 똑같은 요소가 보이면 다 열린 것으로 보고 첫 단계를 시작합니다.
# systems의 경로나 exe로 띄운 앱에만 적용합니다. 비우면 기다리지 않습니다. 작업 파일에 적으면 그 값이 앞섭니다.
# ready_text:

# 준비 신호를 기다리는 최대 시간(초, 1 이상의 정수, 기본 180). 넘으면 모델을 부르지 않고 멈춥니다.
# ready_timeout_s:

# workflow를 시스템별로 저장하는 폴더(기본: 이 예제 폴더의 workflows). 상대 경로는 이 파일이 있는 폴더를 기준으로 합니다.
# 우선순위: run.py --workflow-dir > 이 값 > 환경변수 AGENT_WORKFLOW_DIR > 기본 폴더
# 따옴표 없이 적습니다. 큰따옴표 안에서는 역슬래시가 특수 문자입니다(작은따옴표는 괜찮습니다).
#   예) workflow_dir: D:\Example\workflows
# workflow_dir:

# 시스템 프로파일(준비 신호, ID에 붙인 등록 이름)을 시스템별 <시스템>.yaml로 두는 폴더(기본: 이 예제 폴더의 profiles).
# 상대 경로는 이 파일이 있는 폴더를 기준으로 합니다. 뷰어의 등록 화면이 이 폴더에 씁니다.
# 우선순위: run.py·view.py --profile-dir > 이 값 > 환경변수 AGENT_PROFILE_DIR > 기본 폴더
# .env를 고르는 --profile(AGENT_PROFILE)과는 다른 것입니다.
# 따옴표 없이 적습니다. 큰따옴표 안에서는 역슬래시가 특수 문자입니다(작은따옴표는 괜찮습니다).
#   예) profile_dir: D:\Example\profiles
# profile_dir:

# 회사 캡처 세션(survey.py)의 캡처 단축키(기본 ctrl+alt+f9). 수식키(ctrl, alt, shift, win)와 키 하나(f1-f24, a-z, 0-9).
# survey_capture_hotkey:

# 회사 캡처 세션의 종료 단축키(기본 ctrl+alt+f10). 형식은 위와 같습니다.
# survey_end_hotkey:

# 캡처 세션이 앱으로 셀 실행 파일을 더 적습니다(절대 경로 목록). 진짜 앱이 런처와 다른 폴더에 있을 때 씁니다.
# 그 실행 파일의 폴더 아래 프로세스도 앱으로 셉니다. 따옴표 없이 적거나 작은따옴표로 감쌉니다.
#   예) survey_app_exes:
#         - D:\Example\Copy\App.exe
# survey_app_exes:
